name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 只跑 astro build（消费已提交的 src/data/restaurants.generated.json）；
      # 数据管线不在公开仓，数据更新在私有工作区跑 data:build 后同步 generated.json。
      - run: npm run build
        env:
          PUBLIC_AMAP_KEY: ${{ secrets.PUBLIC_AMAP_KEY }}
          PUBLIC_AMAP_SECURITY: ${{ secrets.PUBLIC_AMAP_SECURITY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
